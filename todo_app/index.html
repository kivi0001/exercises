<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="script.js"></script>
    <title>ToDoApp</title>
  </head>
  <body>
    <header>
      <h1>ToDo list creator</h1>
    </header>
    <main>
      <section class="todo-list-section">
        <h2>ToDo lists</h2>
        <div class="list-input-and-btn">
          <input type="text" name="input-text" id="todolist-text" />
          <button class="todo-list-button">Add todolist</button>
        </div>
        <ul class="todolist-container"></ul>
        <div class="delete-list-btn-div">
          <button class="delete-list-btn"></button>
        </div>
      </section>
      <section class="todo-section">
        <h2 class="list-headline"></h2>
        <section class="todo-tasks-and-done-section">
          <div class="todo-div">
            <h3>Yet to be completed...</h3>
            <div class="task-list-div">
              <div class="task-input-and-btn-div">
                <input type="text" name="input-task-text" id="todo-text" />
                <button class="todo-button">Add task</button>
              </div>
              <div class="sort-btn-div">
                <h4>Sort by:</h4>
                <button class="sort-btn">Priority ⭐</button>
              </div>
              <ul class="todo-container"></ul>
              <div class="delete-task-btn-div">
                <button class="delete-task-btn"></button>
              </div>
            </div>
          </div>
          <div class="done-div">
            <h3>DONE!</h3>
            <ul class="done-container"></ul>
          </div>
        </section>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
