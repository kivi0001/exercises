<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="script.js"></script>
    <title>ToDoApp</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="todo-list-section">
        <input type="text" name="input-text" id="todolist-text" />
        <button class="todo-list-button">Add todolist</button>
        <ul class="todolist-container"></ul>
        <div class="delete-list-btn">
          <button delete-list-btn></button>
        </div>
      </section>
      <section class="todo-tasks-and-done-section">
        <div class="todo-div">
          <div class="headline-and-delete">
            <h1 class="list-headline"></h1>
          </div>
          <div class="sort-btn-div">
            <h3>Sort by:</h3>
            <button class="sort-btn">Priority ⭐</button>
          </div>
          <div class="task-list-div">
            <input type="text" name="input-task-text" id="todo-text" />
            <button class="todo-button">Add task</button>
            <ul class="todo-container"></ul>
            <div class="delete-task-btn">
              <button delete-task-btn></button>
            </div>
          </div>
        </div>
        <div>
          <h2>DONE!</h2>
          <ul class="done-container"></ul>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
